<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-labelledby="t d">
  <title id="t">Logbook</title>
  <desc id="d">Logbook: pick where the vault lives, Claude reads the Home note and open items at the start of each session, and each job adds one observed line to the Build Log</desc>
  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  </style>

