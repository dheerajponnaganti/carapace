  <title id="t">Claude Code with carapace</title>
  <desc id="d">A Claude Code window: the reply, the spinner, then the carapace bar with the job title, plan limit and context gauges, a checklist with a depth ruler and progress, a stuck row with Stop, the five buttons (Crew, Refine, Clean, Logbook, Report) and Shipyard, and the footer with model, effort, branch and the cache countdown.</desc>
