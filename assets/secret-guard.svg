<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">Secret guard</title>
  <desc id="d">Secret guard blocks a Read of .env with a message, and masks an API key in tool output as [secret masked]. The command /secrets allow path lets one read through.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1B2A"/><stop offset="0.55" stop-color="#06121C"/><stop offset="1" stop-color="#030B12"/></linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="none"/><circle cx="1" cy="1" r="0.5" fill="#D8ECF7" opacity="0.035"/></pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1280" height="380" rx="18" fill="url(#sea)"/>
  <rect width="1280" height="380" rx="18" fill="url(#grain)"/>
<text class="mono" x="40" y="46" font-size="13" letter-spacing="3" fill="#5E7E96">SECRET GUARD</text>
<text class="sans" x="40" y="80" font-size="24" fill="#D8ECF7" font-weight="700" xml:space="preserve">Keys stay out of the chat</text>
<rect x="40" y="110" width="580" height="230" rx="12" fill="#0B1B2A" stroke="#17324A"/>
<text class="mono" x="60" y="136" font-size="11" fill="#FF5C7A" xml:space="preserve">BLOCKED</text>
<text class="mono" x="60" y="166" font-size="14" fill="#D8ECF7" xml:space="preserve">⏺ Read(.env)</text>
<text class="mono" x="60" y="192" font-size="12" fill="#FF5C7A" xml:space="preserve">  ⎿  ⛨ secret-guard blocked a read of .env, which looks</text>
<text class="mono" x="60" y="210" font-size="12" fill="#FF5C7A" xml:space="preserve">     like a secret file.</text>
<text class="mono" x="60" y="244" font-size="12" fill="#5E7E96" xml:space="preserve">.env  .env.*  *.pem  *.key  id_rsa  .npmrc  .netrc</text>
<text class="mono" x="60" y="264" font-size="12" fill="#5E7E96" xml:space="preserve">credentials.json  .aws/credentials  and cat, grep, head ... on them</text>
<text class="mono" x="60" y="300" font-size="12" fill="#3DDC97" xml:space="preserve">.env.example and .env.sample stay readable.</text>
<rect x="660" y="110" width="580" height="230" rx="12" fill="#0B1B2A" stroke="#1B8FA6"/>
<text class="mono" x="680" y="136" font-size="11" fill="#E8B44A" xml:space="preserve">MASKED</text>
<text class="mono" x="680" y="166" font-size="14" fill="#D8ECF7" xml:space="preserve">⏺ Bash(npm run debug)</text>
<text class="mono" x="680" y="192" font-size="12" fill="#5E7E96" xml:space="preserve">  ⎿  OPENAI_API_KEY=</text>
<text class="mono" x="880" y="192" font-size="12" fill="#E8B44A" font-weight="700" xml:space="preserve">[secret masked]</text>
<text class="mono" x="680" y="214" font-size="12" fill="#5E7E96" xml:space="preserve">  ⎿  AWS_ACCESS_KEY_ID=</text>
<text class="mono" x="880" y="214" font-size="12" fill="#E8B44A" font-weight="700" xml:space="preserve">[secret masked]</text>
<text class="mono" x="680" y="246" font-size="12" fill="#5E7E96" xml:space="preserve">Keys of known shapes (sk-, ghp_, AKIA, xox, AIza),</text>
<text class="mono" x="680" y="264" font-size="12" fill="#5E7E96" xml:space="preserve">Bearer tokens and private key blocks are masked in tool output.</text>
<text class="mono" x="680" y="300" font-size="13" fill="#3FE0F0" font-weight="700" xml:space="preserve">/secrets allow &lt;path></text>
<text class="mono" x="860" y="300" font-size="12" fill="#5E7E96" xml:space="preserve">lets the next read of one path through</text>
</svg>
